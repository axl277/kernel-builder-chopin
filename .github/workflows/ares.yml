name: Chopin Universal Kernel Builder

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: "Select kernel version"
        required: true
        type: choice
        options:
          - "4.14"
          - "4.19"
        default: "4.14"

      use_anykernel:
        description: "Package the compiled kernel with AnyKernel3"
        required: true
        type: boolean
        default: true

      ccache_enabled:
        description: "Enable ccache to speed up compilation"
        required: true
        type: boolean
        default: true

      ccache_update:
        description: "Skip cache restore and create a fresh cache"
        required: true
        type: boolean
        default: false

      kernel_suffix:
        description: "Optional kernel version suffix"
        required: false
        type: string
        default: ""

env:
  TZ: Asia/Jakarta
  ARCH: arm64
  OUT_DIR: ${{ github.workspace }}/out
  ANYKERNEL_REPO: https://github.com/axl277/AnyKernel3
  ANYKERNEL_BRANCH: master

jobs:
  build:
    name: Build Linux ${{ inputs.kernel_version }} kernel
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: write

    steps:
      - name: Initialize build environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            device-tree-compiler \
            flex \
            git \
            libelf-dev \
            libfl-dev \
            libncurses-dev \
            libssl-dev \
            python3 \
            unzip \
            zip

      - name: Select kernel source and build configuration
        id: kernel
        shell: bash
        env:
          SELECTED_KERNEL: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail

          case "$SELECTED_KERNEL" in
            "4.14")
              KERNEL_REPO="https://github.com/seriaTvT/kernel_mt6893"
              KERNEL_BRANCH="chopin_kvm"
              DEFCONFIG="chopin_defconfig"
              KERNEL_LABEL="Chopin-4.14"
              TOOLCHAIN="aosp-clang-12"
              ;;
            "4.19")
              KERNEL_REPO="https://github.com/axl277/kernel_xiaomi_mt6893_419"
              KERNEL_BRANCH="cp-cfg"
              DEFCONFIG="chopin_defconfig"
              KERNEL_LABEL="Chopin-4.19"
              TOOLCHAIN="aosp-clang-r383902"
              ;;
            *)
              echo "::error::Unsupported kernel version: $SELECTED_KERNEL"
              exit 1
              ;;
          esac

          {
            echo "KERNEL_REPO=$KERNEL_REPO"
            echo "KERNEL_BRANCH=$KERNEL_BRANCH"
            echo "DEFCONFIG=$DEFCONFIG"
            echo "KERNEL_LABEL=$KERNEL_LABEL"
            echo "TOOLCHAIN=$TOOLCHAIN"
            echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel-source"
          } >> "$GITHUB_ENV"

          echo "Selected Linux $SELECTED_KERNEL"
          echo "Repository: $KERNEL_REPO"
          echo "Branch: $KERNEL_BRANCH"
          echo "Defconfig: $DEFCONFIG"
          echo "Toolchain: $TOOLCHAIN"

      - name: Clone kernel source
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive --depth=1 \
            --branch "$KERNEL_BRANCH" \
            "$KERNEL_REPO" \
            "$KERNEL_DIR"

          test -f "$KERNEL_DIR/Makefile"
          test -f "$KERNEL_DIR/arch/arm64/configs/$DEFCONFIG"

      - name: Download AOSP Clang 12 and GCC 4.9 binutils
        if: inputs.kernel_version == '4.14'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang-12"

          CLANG_URL="https://github.com/seriaTvT/kernel-builder-chopin/releases/download/Toolchain/linux-x86-bd96dfe349c962681f0e5388af874c771ef96670-clang-r416183b.tar.gz"
          curl -fL --retry 3 --retry-delay 5 "$CLANG_URL" -o "$RUNNER_TEMP/clang-12.tar.gz"
          tar -xf "$RUNNER_TEMP/clang-12.tar.gz" -C "$GITHUB_WORKSPACE/toolchains/clang-12"

          git clone --depth=1 --single-branch \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc-aarch64-4.9"

          git clone --depth=1 --single-branch \
            --branch lineage-19.1 \
            https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 \
            "$GITHUB_WORKSPACE/toolchains/gcc-arm-4.9"

          echo "$GITHUB_WORKSPACE/toolchains/clang-12/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc-aarch64-4.9/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/toolchains/gcc-arm-4.9/bin" >> "$GITHUB_PATH"

      - name: Download AOSP Clang r383902
        if: inputs.kernel_version == '4.19'
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/toolchains/clang-r383902"

          CLANG_URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android11-release/clang-r383902.tar.gz"
          curl -fL --retry 3 --retry-delay 5 "$CLANG_URL" -o "$RUNNER_TEMP/clang-r383902.tar.gz"
          tar -xf "$RUNNER_TEMP/clang-r383902.tar.gz" -C "$GITHUB_WORKSPACE/toolchains/clang-r383902"

          echo "$GITHUB_WORKSPACE/toolchains/clang-r383902/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/toolchains/clang-r383902/lib64:$GITHUB_WORKSPACE/toolchains/clang-r383902/lib" >> "$GITHUB_ENV"

      - name: Configure ccache
        if: inputs.ccache_enabled
        shell: bash
        run: |
          set -euo pipefail
          ccache --set-config=compression=true
          ccache --set-config=cache_dir="$HOME/.ccache"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        if: inputs.ccache_enabled && !inputs.ccache_update
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-chopin-${{ inputs.kernel_version }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-chopin-${{ inputs.kernel_version }}-${{ runner.os }}-${{ github.ref_name }}-
            ccache-chopin-${{ inputs.kernel_version }}-${{ runner.os }}-

      - name: Show compiler version
        shell: bash
        run: |
          set -euo pipefail
          clang --version
          ld.lld --version
          if [[ "${{ inputs.kernel_version }}" == "4.14" ]]; then
            aarch64-linux-android-ld --version
            arm-linux-androideabi-ld --version
          fi

      - name: Generate kernel defconfig
        shell: bash
        working-directory: ${{ github.workspace }}/kernel-source
        env:
          KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
          CCACHE_ENABLED: ${{ inputs.ccache_enabled }}
          SELECTED_KERNEL: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail

          if [[ "$CCACHE_ENABLED" == "true" ]]; then
            CC_CMD="ccache clang"
          else
            CC_CMD="clang"
          fi

          SAFE_SUFFIX="$(printf '%s' "$KERNEL_SUFFIX" | tr -cd '[:alnum:]_.-')"
          if [[ -n "$SAFE_SUFFIX" ]]; then
            export LOCALVERSION="-$SAFE_SUFFIX"
          fi

          if [[ "$SELECTED_KERNEL" == "4.14" ]]; then
            make -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH=arm64 \
              CC="$CC_CMD" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
              LD=ld.lld \
              "$DEFCONFIG"
          else
            make -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="$CC_CMD" \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              READELF=llvm-readelf \
              STRIP=llvm-strip \
              CROSS_COMPILE=aarch64-linux-gnu- \
              "$DEFCONFIG"
          fi

      - name: Compile kernel and device trees
        shell: bash
        working-directory: ${{ github.workspace }}/kernel-source
        env:
          KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
          CCACHE_ENABLED: ${{ inputs.ccache_enabled }}
          SELECTED_KERNEL: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail

          if [[ "$CCACHE_ENABLED" == "true" ]]; then
            CC_CMD="ccache clang"
            ccache --zero-stats
          else
            CC_CMD="clang"
          fi

          SAFE_SUFFIX="$(printf '%s' "$KERNEL_SUFFIX" | tr -cd '[:alnum:]_.-')"
          if [[ -n "$SAFE_SUFFIX" ]]; then
            export LOCALVERSION="-$SAFE_SUFFIX"
          fi

          if [[ "$SELECTED_KERNEL" == "4.14" ]]; then
            make -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH=arm64 \
              CC="$CC_CMD" \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CROSS_COMPILE=aarch64-linux-android- \
              CROSS_COMPILE_ARM32=arm-linux-androideabi- \
              CROSS_COMPILE_COMPAT=arm-linux-androideabi- \
              LD=ld.lld \
              Image dtbs
          else
            make -j"$(nproc)" \
              O="$OUT_DIR" \
              ARCH=arm64 \
              LLVM=1 \
              LLVM_IAS=1 \
              CC="$CC_CMD" \
              LD=ld.lld \
              AR=llvm-ar \
              NM=llvm-nm \
              OBJCOPY=llvm-objcopy \
              OBJDUMP=llvm-objdump \
              READELF=llvm-readelf \
              STRIP=llvm-strip \
              CROSS_COMPILE=aarch64-linux-gnu- \
              Image dtbs
          fi

      - name: Show ccache statistics
        if: always() && inputs.ccache_enabled
        shell: bash
        run: ccache --show-stats

      - name: Save ccache
        if: always() && inputs.ccache_enabled
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ccache-chopin-${{ inputs.kernel_version }}-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}

      - name: Validate and prepare build outputs
        id: outputs
        shell: bash
        env:
          KERNEL_SUFFIX: ${{ inputs.kernel_suffix }}
          SELECTED_KERNEL: ${{ inputs.kernel_version }}
        run: |
          set -euo pipefail

          BOOT_DIR="$OUT_DIR/arch/arm64/boot"
          BUILD_DATE="$(date +'%Y%m%d-%H%M%S')"
          SAFE_SUFFIX="$(printf '%s' "$KERNEL_SUFFIX" | tr -cd '[:alnum:]_.-')"
          SUFFIX_PART=""
          if [[ -n "$SAFE_SUFFIX" ]]; then
            SUFFIX_PART="-$SAFE_SUFFIX"
          fi

          test -s "$BOOT_DIR/Image"

          DTB_DIR="$BOOT_DIR/dts"
          if [[ ! -d "$DTB_DIR" ]]; then
            echo "::error::DTB output directory not found: $DTB_DIR"
            exit 1
          fi

          find "$DTB_DIR" -type f -name '*.dtb' -print0 | sort -z | xargs -0 -r cat > "$BOOT_DIR/dtb"
          test -s "$BOOT_DIR/dtb"

          ARTIFACT_PREFIX="chopin-${SELECTED_KERNEL}${SUFFIX_PART}-${BUILD_DATE}"

          {
            echo "artifact_prefix=$ARTIFACT_PREFIX"
            echo "image_artifact=${ARTIFACT_PREFIX}-Image"
            echo "dtb_artifact=${ARTIFACT_PREFIX}-DTB"
            echo "zip_name=${ARTIFACT_PREFIX}-AnyKernel3.zip"
          } >> "$GITHUB_OUTPUT"

          echo "Kernel image: $BOOT_DIR/Image"
          echo "Combined DTB: $BOOT_DIR/dtb"

      - name: Clone AnyKernel3
        if: inputs.use_anykernel
        shell: bash
        run: |
          set -euo pipefail
          git clone --recursive --depth=1 \
            --branch "$ANYKERNEL_BRANCH" \
            "$ANYKERNEL_REPO" \
            "$GITHUB_WORKSPACE/AnyKernel3"

      - name: Package AnyKernel3
        if: inputs.use_anykernel
        shell: bash
        env:
          ZIP_NAME: ${{ steps.outputs.outputs.zip_name }}
        run: |
          set -euo pipefail

          BOOT_DIR="$OUT_DIR/arch/arm64/boot"
          AK3_DIR="$GITHUB_WORKSPACE/AnyKernel3"

          cp -f "$BOOT_DIR/Image" "$AK3_DIR/"
          cp -f "$BOOT_DIR/dtb" "$AK3_DIR/"

          [[ ! -f "$BOOT_DIR/Image.gz" ]] || cp -f "$BOOT_DIR/Image.gz" "$AK3_DIR/"
          [[ ! -f "$BOOT_DIR/dtbo" ]] || cp -f "$BOOT_DIR/dtbo" "$AK3_DIR/"
          [[ ! -f "$BOOT_DIR/dtbo.img" ]] || cp -f "$BOOT_DIR/dtbo.img" "$AK3_DIR/"

          cd "$AK3_DIR"
          zip -q -r "$GITHUB_WORKSPACE/$ZIP_NAME" . \
            -x ".git/*" ".github/*" "README.md"

      - name: Upload kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.outputs.outputs.image_artifact }}
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/Image
          if-no-files-found: error
          retention-days: 7

      - name: Upload combined DTB
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.outputs.outputs.dtb_artifact }}
          path: ${{ env.OUT_DIR }}/arch/arm64/boot/dtb
          if-no-files-found: error
          retention-days: 7

      - name: Upload AnyKernel3 ZIP
        if: inputs.use_anykernel
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.outputs.outputs.zip_name }}
          path: ${{ github.workspace }}/${{ steps.outputs.outputs.zip_name }}
          if-no-files-found: error
          retention-days: 7
